[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./config" }, { access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v3-core/=lib/v3-core/",
  "@uniswap/v3-periphery/=lib/v3-periphery/",
  "permit2/=lib/permit2/",
  "forge-std/=lib/forge-std/src/",
]

additional_compiler_profiles = [{ name = "size", optimizer_runs = 1 }]
compilation_restrictions = [{ paths = "src/QudaoVault.sol", optimizer_runs = 1 }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[fmt]
line_length = 120
